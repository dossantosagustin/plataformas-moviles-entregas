<!doctype html>
<html lang="es">

	<title>Datos curiosos</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
	<main class="container">
		<h1>Datos curiosos</h1>

		<a id="daily-source" target="_blank" rel="noopener noreferrer" hidden>Ver fuente</a>

		<h2>Otro dato aleatorio</h2>
		<button class="btn btn-primary" id="random-button" type="button">Buscar otro dato</button>

		<a id="random-source" target="_blank" rel="noopener noreferrer" hidden>Ver fuente</a>
	</main>
</body>
</html>
